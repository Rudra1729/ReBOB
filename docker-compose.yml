services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rebob
      POSTGRES_PASSWORD: rebob
      POSTGRES_DB: rebob
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rebob -d rebob"]
      interval: 3s
      timeout: 5s
      retries: 10
