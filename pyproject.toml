[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rebob"
version = "0.1.0"
description = "Persistent memory for IBM Bob 2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp",
  "python-dotenv",
  "ibm-watsonx-ai",
  "numpy",
]

[project.scripts]
rebob = "rebob.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rebob*"]

[tool.setuptools.package-data]
rebob = ["templates/*"]
